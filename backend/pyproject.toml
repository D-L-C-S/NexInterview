[project]
name = "nexinterview-backend"
version = "0.1.0"
description = "NexInterview — Intelligent Mock Interview Agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.30",
    "pdfplumber>=0.11",
    "openai-whisper>=20240930",
    "librosa>=0.10",
    "opencv-python>=4.10",
    "mediapipe>=0.10",
    "deepface>=0.0.92",
    "sqlalchemy>=2.0",
    "aiofiles>=23.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I"]
