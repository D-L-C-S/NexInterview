[project]
name = "nexinterview-backend"
version = "0.1.0"
description = "NexInterview — Intelligent Mock Interview Agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-generativeai>=0.7",
    "groq>=0.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "openai-whisper>=20240930",
    "librosa>=0.10",
    "opencv-python>=4.10",
    "mediapipe>=0.10",
    "deepface>=0.0.92",
    "sqlalchemy>=2.0",
    "aiofiles>=23.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "google-genai>=1.75.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Source root is one level up (NexInterview/) so that `backend/` is the package,
# matching the `from backend.x import y` import style used throughout the project.
sources = [".."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
